name: Dependabot Auto-Merge
# Best Practice: Keep your workflow on on: pull_request. By default, GitHub treats Dependabot pull_request events with a highly restricted, read-only token context to safeguard secrets against untrusted code execution. [1] (https://github.com/orgs/community/discussions/163952)
on: pull_request

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Strictly ensure this only runs for Dependabot to prevent unauthorized exploits
    if: |
      github.actor == 'dependabot[bot]' && 
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Auto-merge only patches and minor updates for safety
      - name: Approve and Enable Auto-Merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
