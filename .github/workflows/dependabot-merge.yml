# ==============================================================================
# AUTOMATED DEPENDABOT PR APPROVAL & ASTRO BUILD VALIDATION
# ==============================================================================
# No repository setup required — this does a direct squash merge rather
# than GitHub's "auto-merge" feature, so it doesn't need branch protection
# rules on main (GitHub's auto-merge mutation refuses to attach without them).
#
# HOW THE SAFETY NET WORKS:
# 1. It checks out your code and installs the updated dependencies.
# 2. It runs `npm run build` to see if your Astro site compiles without errors.
# 3. IF THE BUILD PASSES: It approves the PR and squash-merges it immediately.
# 4. IF THE BUILD FAILS: The script crashes, prevents the merge, and leaves
#    the PR open so you can see what broke without risking your main branch.
# ==============================================================================

name: Dependabot Auto-Merge
# Best Practice: Keep your workflow on on: pull_request. By default, GitHub treats Dependabot pull_request events with a highly restricted, read-only token context to safeguard secrets against untrusted code execution. [1] (https://github.com/orgs/community/discussions/163952)
on: pull_request

permissions:
  pull-requests: write
  contents: write
jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Strictly ensure this only runs for Dependabot to prevent unauthorized exploits
    if: |
      github.actor == 'dependabot[bot]' && 
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Astro requires Node >=22.12 (deploy.yml's withastro/action also defaults to 22)
          cache: 'npm'

      # The gatekeeper step: Installs packages using the project lockfile
      - name: Install dependencies
        run: npm ci

      # The ultimate validation step: Ensures Astro compiles smoothly 
      - name: Run Astro Build Validation
        run: npm run build

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # If the 'Astro Build Validation' step crashes, this step will be skipped completely.
      # A direct merge (not --auto) because `--auto` requires branch protection
      # rules on main to exist at all, which this repo doesn't have — the build
      # already gates this step, so there's nothing else to wait on.
      - name: Approve and Merge
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
